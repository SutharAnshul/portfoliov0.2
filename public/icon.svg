<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    The site's own mark: the crosshair that is the cursor, the four corner
    crosses that mark a selection, and the bullets in Skills & Tools.

    Inverted against the browser chrome rather than matching it — a dark tile in
    a light toolbar and a light tile in a dark one, so the tab reads as an
    object on the bar instead of dissolving into it. That is the behaviour the
    v0 mark had here, and it was the one part worth keeping.
  -->
  <style>
    .bg { fill: #111111; }
    .fg { fill: #FAFAFA; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #FAFAFA; }
      .fg { fill: #111111; }
    }
  </style>

  <rect class="bg" width="180" height="180" rx="37" />

  <!-- Arms stop well short of the edge; a + that runs to the corners reads as
       a divided square rather than as a mark sitting on one. -->
  <g class="fg">
    <rect x="42" y="83" width="96" height="14" rx="7" />
    <rect x="83" y="42" width="14" height="96" rx="7" />
  </g>
</svg>
